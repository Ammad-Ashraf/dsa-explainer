name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: System libraries for Manim (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcairo2-dev libpango1.0-dev pkg-config ffmpeg
      - name: System libraries for Manim (macOS)
        if: runner.os == 'macOS'
        run: brew install cairo pango pkg-config
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -e . --no-deps
          pip install ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests
        # The voice model is not downloaded in CI: tests that speak or render a real clip skip themselves.
        run: python -m pytest backend -q
      - name: Command line
        run: dsa-explainer --version

  frontend:
    name: Web app (type check, lint, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build   # tsc --noEmit, eslint, vite build

  package:
    name: Wheel with the bundled web app
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the web app and bundle it
        run: |
          cd frontend && npm ci && npm run build && cd ..
          python backend/scripts/bundle_frontend.py
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel
      - name: The wheel contains the app, the plans and the font
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          for needed in ("dsa_explainer/web/index.html", "dsa_explainer/plans/stack.json",
                         "dsa_explainer/media/fonts/OFL.txt"):
              assert needed in names, needed
          print(len(names), "files in the wheel")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: wheel
          path: dist/*.whl
